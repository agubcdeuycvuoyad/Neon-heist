<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>NEON HEIST</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050510;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    position:fixed;
    inset:0;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:10;

    display:flex;
    justify-content:space-between;
    align-items:center;

    color:white;
    font-weight:bold;
    font-size:15px;

    pointer-events:none;
}

.hudBox{
    background:rgba(0,0,0,.65);
    border:1px solid #19f7ff;
    border-radius:12px;
    padding:8px 12px;
    text-shadow:0 0 8px #19f7ff;
}

#message{
    position:fixed;
    top:70px;
    left:50%;
    transform:translateX(-50%);

    z-index:30;

    color:white;
    font-size:22px;
    font-weight:bold;

    text-align:center;

    text-shadow:
        0 0 8px #19f7ff,
        0 0 20px #19f7ff;

    pointer-events:none;
}

.screen{
    position:fixed;
    inset:0;
    z-index:50;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at center,
        rgba(25,247,255,.15),
        rgba(0,0,0,.95) 65%);

    color:white;
    text-align:center;
}

.panel{
    width:min(90%,500px);
    padding:30px;

    border:2px solid #19f7ff;
    border-radius:22px;

    background:rgba(5,5,20,.92);

    box-shadow:
        0 0 25px rgba(25,247,255,.5),
        inset 0 0 30px rgba(25,247,255,.08);
}

h1{
    margin:0 0 10px;

    font-size:48px;

    color:#19f7ff;

    text-shadow:
        0 0 10px #19f7ff,
        0 0 30px #19f7ff;
}

.subtitle{
    color:#aaa;
    margin-bottom:25px;
}

button{
    border:none;
    outline:none;

    font-weight:bold;
    color:white;

    cursor:pointer;

    touch-action:none;
}

.startButton{
    padding:16px 35px;

    border-radius:15px;

    background:#19f7ff;
    color:#001014;

    font-size:20px;

    box-shadow:0 0 20px rgba(25,247,255,.6);
}

.startButton:active{
    transform:scale(.95);
}

.hidden{
    display:none!important;
}

/* =========================
   IPAD / MOBILE CONTROLS
========================= */

#mobileControls{
    position:fixed;
    inset:0;

    z-index:20;

    pointer-events:none;

    display:block;
}

/* JOYSTICK */

#joystick{
    position:absolute;

    left:25px;
    bottom:25px;

    width:135px;
    height:135px;

    border-radius:50%;

    background:rgba(20,30,45,.65);

    border:3px solid rgba(25,247,255,.8);

    box-shadow:
        0 0 20px rgba(25,247,255,.35),
        inset 0 0 20px rgba(25,247,255,.15);

    pointer-events:auto;

    touch-action:none;
}

#stick{
    position:absolute;

    width:58px;
    height:58px;

    left:50%;
    top:50%;

    margin-left:-29px;
    margin-top:-29px;

    border-radius:50%;

    background:#19f7ff;

    box-shadow:
        0 0 15px #19f7ff,
        0 0 30px #19f7ff;

    pointer-events:none;
}

/* BUTTONS */

.mobileButton{
    position:absolute;

    width:90px;
    height:90px;

    border-radius:50%;

    background:rgba(20,20,35,.8);

    border:3px solid #ff2bd6;

    color:#fff;

    font-size:14px;

    box-shadow:
        0 0 15px rgba(255,43,214,.5);

    pointer-events:auto;

    touch-action:none;
}

.mobileButton:active{
    transform:scale(.9);
    background:#ff2bd6;
}

#hackButton{
    right:130px;
    bottom:35px;
}

#dashButton{
    right:25px;
    bottom:115px;

    border-color:#19f7ff;

    box-shadow:
        0 0 15px rgba(25,247,255,.5);
}

#pauseButton{
    position:fixed;

    top:65px;
    right:12px;

    z-index:25;

    width:45px;
    height:45px;

    border-radius:12px;

    background:rgba(0,0,0,.7);

    border:1px solid #19f7ff;

    color:white;

    pointer-events:auto;
}

/* LANDSCAPE IPAD */

@media (orientation:landscape) and (max-height:600px){

    #joystick{
        width:115px;
        height:115px;

        left:20px;
        bottom:18px;
    }

    #stick{
        width:52px;
        height:52px;

        margin-left:-26px;
        margin-top:-26px;
    }

    .mobileButton{
        width:75px;
        height:75px;
    }

    #hackButton{
        right:110px;
        bottom:20px;
    }

    #dashButton{
        right:20px;
        bottom:95px;
    }
}

/* SMALL PHONES */

@media (max-width:420px){

    #joystick{
        width:120px;
        height:120px;

        left:15px;
        bottom:18px;
    }

    .mobileButton{
        width:75px;
        height:75px;
        font-size:12px;
    }

    #hackButton{
        right:95px;
        bottom:20px;
    }

    #dashButton{
        right:15px;
        bottom:100px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div class="hudBox">
        LEVEL: <span id="level">1</span>
    </div>

    <div class="hudBox">
        💰 <span id="cash">0</span>
    </div>

    <div class="hudBox">
        ❤️ <span id="lives">3</span>
    </div>

    <div class="hudBox">
        SCORE: <span id="score">0</span>
    </div>

</div>

<div id="message"></div>

<button id="pauseButton">Ⅱ</button>

<!-- START SCREEN -->

<div id="startScreen" class="screen">

    <div class="panel">

        <h1>NEON HEIST</h1>

        <div class="subtitle">
            Steal the loot. Avoid the guards. Escape.
        </div>

        <p>
            🎮 Use the joystick to move
        </p>

        <p>
            🔓 Hack terminals
        </p>

        <p>
            💰 Collect the money
        </p>

        <p>
            🚨 Don't get caught
        </p>

        <button class="startButton" id="startButton">
            START HEIST
        </button>

    </div>

</div>

<!-- GAME OVER -->

<div id="gameOverScreen" class="screen hidden">

    <div class="panel">

        <h1>CAUGHT!</h1>

        <p>
            Final Score:
            <strong id="finalScore">0</strong>
        </p>

        <p>
            Level Reached:
            <strong id="finalLevel">1</strong>
        </p>

        <button class="startButton" id="restartButton">
            TRY AGAIN
        </button>

    </div>

</div>

<!-- MOBILE CONTROLS -->

<div id="mobileControls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button
        class="mobileButton"
        id="hackButton">
        HACK
    </button>

    <button
        class="mobileButton"
        id="dashButton">
        DASH
    </button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resizeCanvas(){

    const dpr = Math.min(window.devicePixelRatio || 1,2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resizeCanvas);
window.addEventListener("orientationchange",()=>{
    setTimeout(resizeCanvas,200);
});

resizeCanvas();


/* =========================
   GAME VARIABLES
========================= */

let running = false;
let paused = false;

let level = 1;
let score = 0;
let cash = 0;
let lives = 3;

let alarm = false;
let alertLevel = 0;

let transitioningLevel = false;

let walls = [];
let loot = [];
let guards = [];
let terminals = [];
let particles = [];

let exit = {
    x:0,
    y:0,
    r:25
};


/* =========================
   PLAYER
========================= */

const player = {

    x:100,
    y:100,

    r:15,

    speed:190,

    vx:0,
    vy:0,

    dashCooldown:0,

    invincible:1,

    invisibility:0

};


/* =========================
   INPUT
========================= */

const keys = {};

window.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

    if(
        ["arrowup","arrowdown","arrowleft","arrowright"," "]
        .includes(e.key.toLowerCase())
    ){
        e.preventDefault();
    }

});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});


/* =========================
   JOYSTICK
========================= */

let joystickActive = false;
let joystickX = 0;
let joystickY = 0;

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");


function updateJoystick(clientX,clientY){

    const rect = joystick.getBoundingClientRect();

    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    let dx = clientX - cx;
    let dy = clientY - cy;

    const max = rect.width * 0.31;

    const distance = Math.hypot(dx,dy);

    if(distance > max){

        dx = dx / distance * max;
        dy = dy / distance * max;

    }

    joystickX = dx / max;
    joystickY = dy / max;

    stick.style.transform =
        `translate(${dx}px,${dy}px)`;
}


function resetJoystick(){

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.transform =
        "translate(0,0)";
}


joystick.addEventListener("pointerdown",e=>{

    e.preventDefault();

    joystickActive = true;

    joystick.setPointerCapture(e.pointerId);

    updateJoystick(e.clientX,e.clientY);

});


joystick.addEventListener("pointermove",e=>{

    if(!joystickActive) return;

    e.preventDefault();

    updateJoystick(e.clientX,e.clientY);

});


joystick.addEventListener("pointerup",e=>{

    e.preventDefault();

    resetJoystick();

});


joystick.addEventListener("pointercancel",resetJoystick);


/* =========================
   MOVEMENT
========================= */

function getMovement(){

    let x = 0;
    let y = 0;

    if(keys["w"] || keys["arrowup"])
        y -= 1;

    if(keys["s"] || keys["arrowdown"])
        y += 1;

    if(keys["a"] || keys["arrowleft"])
        x -= 1;

    if(keys["d"] || keys["arrowright"])
        x += 1;

    if(joystickActive){

        x = joystickX;
        y = joystickY;

    }

    const length = Math.hypot(x,y);

    if(length > 0){

        x /= length;
        y /= length;

    }

    return {x,y};
}


/* =========================
   COLLISION
========================= */

function circleRectCollision(cx,cy,r,rect){

    const closestX =
        Math.max(rect.x,Math.min(cx,rect.x+rect.w));

    const closestY =
        Math.max(rect.y,Math.min(cy,rect.y+rect.h));

    const dx = cx - closestX;
    const dy = cy - closestY;

    return dx*dx + dy*dy < r*r;
}


function isBlocked(x,y,r){

    for(const wall of walls){

        if(circleRectCollision(x,y,r,wall))
            return true;

    }

    return false;
}


/* =========================
   SAFE POSITION
========================= */

function safePosition(r=20){

    for(let i=0;i<300;i++){

        const x =
            40 + Math.random() * (W-80);

        const y =
            90 + Math.random() * (H-130);

        if(isBlocked(x,y,r))
            continue;

        if(Math.hypot(x-player.x,y-player.y)<100)
            continue;

        return {x,y};

    }

    return {
        x:W/2,
        y:H/2
    };
}


/* =========================
   CREATE LEVEL
========================= */

function createLevel(){

    walls = [];
    loot = [];
    guards = [];
    terminals = [];
    particles = [];

    alarm = false;
    alertLevel = 0;

    player.vx = 0;
    player.vy = 0;

    player.invincible = 1;

    /* PLAYER SPAWN */

    player.x = 70;
    player.y = H/2;

    /* WALLS */

    const wallCount =
        Math.min(5 + level,16);

    for(let i=0;i<wallCount;i++){

        let tries=0;

        while(tries<100){

            tries++;

            const wall = {

                x:60+Math.random()*(W-180),
                y:90+Math.random()*(H-180),

                w:70+Math.random()*100,
                h:20+Math.random()*45

            };

            if(
                !circleRectCollision(
                    player.x,
                    player.y,
                    60,
                    wall
                )
            ){

                walls.push(wall);

                break;

            }

        }

    }


    /* EXIT */

    exit.x = W - 70;
    exit.y = H/2;

    /* LOOT */

    const lootCount =
        Math.min(3 + Math.floor(level/2),9);

    for(let i=0;i<lootCount;i++){

        const p = safePosition(15);

        loot.push({

            x:p.x,
            y:p.y,

            r:10,

            value:50 + level*15,

            collected:false

        });

    }


    /* TERMINALS */

    const terminalCount =
        Math.min(1 + Math.floor(level/4),3);

    for(let i=0;i<terminalCount;i++){

        const p = safePosition(18);

        terminals.push({

            x:p.x,
            y:p.y,

            r:16,

            hacked:false

        });

    }


    /* GUARDS */

    const guardCount =
        Math.min(1 + Math.floor(level/2),8);

    for(let i=0;i<guardCount;i++){

        const p = safePosition(20);

        guards.push({

            x:p.x,
            y:p.y,

            r:14,

            speed:
                45 + level*5,

            angle:
                Math.random()*Math.PI*2,

            viewDistance:
                150 + level*5,

            viewAngle:
                Math.PI/3,

            turnTimer:
                1+Math.random()*2

        });

    }

    updateHUD();

}


/* =========================
   HUD
========================= */

function updateHUD(){

    document.getElementById("level").textContent =
        level;

    document.getElementById("cash").textContent =
        cash;

    document.getElementById("lives").textContent =
        lives;

    document.getElementById("score").textContent =
        score;

}


/* =========================
   MESSAGE
========================= */

let messageTimer = 0;

function showMessage(text){

    const message =
        document.getElementById("message");

    message.textContent = text;

    messageTimer = 2;

}


/* =========================
   DASH
========================= */

function dash(){

    if(!running || paused || transitioningLevel)
        return;

    if(player.dashCooldown > 0)
        return;

    const movement = getMovement();

    let x = movement.x;
    let y = movement.y;

    if(x===0 && y===0)
        return;

    player.x += x * 120;
    player.y += y * 120;

    player.x =
        Math.max(
            player.r,
            Math.min(W-player.r,player.x)
        );

    player.y =
        Math.max(
            75,
            Math.min(H-player.r,player.y)
        );

    player.dashCooldown = 2;

    player.invincible = .3;

    spawnParticles(
        player.x,
        player.y,
        "#19f7ff",
        20
    );

}


/* =========================
   HACK
========================= */

function hack(){

    if(!running || paused)
        return;

    for(const terminal of terminals){

        if(terminal.hacked)
            continue;

        const d =
            Math.hypot(
                player.x-terminal.x,
                player.y-terminal.y
            );

        if(d < 65){

            terminal.hacked = true;

            score += 100;

            showMessage("TERMINAL HACKED +100");

            spawnParticles(
                terminal.x,
                terminal.y,
                "#ff2bd6",
                25
            );

            updateHUD();

            return;

        }

    }

}


/* =========================
   BUTTONS
========================= */

document.getElementById("dashButton")
.addEventListener("pointerdown",e=>{

    e.preventDefault();

    dash();

});


document.getElementById("hackButton")
.addEventListener("pointerdown",e=>{

    e.preventDefault();

    hack();

});


document.getElementById("pauseButton")
.addEventListener("pointerdown",e=>{

    e.preventDefault();

    if(!running) return;

    paused = !paused;

    document.getElementById("pauseButton")
        .textContent =
        paused ? "▶" : "Ⅱ";

});


document.getElementById("startButton")
.addEventListener("pointerdown",e=>{

    e.preventDefault();

    startGame();

});


document.getElementById("restartButton")
.addEventListener("pointerdown",e=>{

    e.preventDefault();

    startGame();

});


/* =========================
   START GAME
========================= */

function startGame(){

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("gameOverScreen")
        .classList.add("hidden");

    running = true;

    paused = false;

    transitioningLevel = false;

    level = 1;

    score = 0;

    cash = 0;

    lives = 3;

    alertLevel = 0;

    alarm = false;

    player.speed = 190;

    player.dashCooldown = 0;

    player.invincible = 1;

    player.vx = 0;

    player.vy = 0;

    createLevel();

    updateHUD();

}


/* =========================
   PLAYER MOVEMENT
========================= */

function movePlayer(dt){

    if(transitioningLevel)
        return;

    const movement =
        getMovement();

    player.vx =
        movement.x * player.speed;

    player.vy =
        movement.y * player.speed;

    const newX =
        player.x + player.vx * dt;

    const newY =
        player.y + player.vy * dt;

    if(!isBlocked(newX,player.y,player.r)){

        player.x = newX;

    }

    if(!isBlocked(player.x,newY,player.r)){

        player.y = newY;

    }

    player.x =
        Math.max(
            player.r,
            Math.min(W-player.r,player.x)
        );

    player.y =
        Math.max(
            65,
            Math.min(H-player.r,player.y)
        );

}


/* =========================
   LOOT
========================= */

function collectLoot(){

    for(const item of loot){

        if(item.collected)
            continue;

        const distance =
            Math.hypot(
                player.x-item.x,
                player.y-item.y
            );

        if(distance < player.r + item.r){

            item.collected = true;

            cash += item.value;

            score += item.value;

            showMessage(
                "LOOT +" + item.value
            );

            spawnParticles(
                item.x,
                item.y,
                "#ffe600",
                18
            );

            updateHUD();

        }

    }

}


/* =========================
   EXIT
========================= */

function checkExit(){

    const distance =
        Math.hypot(
            player.x-exit.x,
            player.y-exit.y
        );

    const allLoot =
        loot.every(item=>item.collected);

    if(
        distance < player.r + exit.r &&
        allLoot &&
        !transitioningLevel
    ){

        levelComplete();

    }

}


/* =========================
   LEVEL COMPLETE
========================= */

function levelComplete(){

    if(transitioningLevel)
        return;

    transitioningLevel = true;

    const reward = cash * 2;

    score += reward;

    showMessage(
        "HEIST COMPLETE! +" + reward
    );

    player.vx = 0;
    player.vy = 0;

    setTimeout(()=>{

        if(!running){

            transitioningLevel = false;

            return;

        }

        /* EXACTLY ONE LEVEL UP */

        level++;

        if(level < 1)
            level = 1;

        createLevel();

        transitioningLevel = false;

        updateHUD();

    },1200);

}


/* =========================
   GUARDS
========================= */

function updateGuards(dt){

    alarm = false;

    for(const guard of guards){

        guard.turnTimer -= dt;

        if(guard.turnTimer <= 0){

            guard.turnTimer =
                1+Math.random()*2;

            guard.angle +=
                (Math.random()-.5)*1.8;

        }

        const dx =
            player.x-guard.x;

        const dy =
            player.y-guard.y;

        const distance =
            Math.hypot(dx,dy);

        const playerAngle =
            Math.atan2(dy,dx);

        let angleDifference =
            playerAngle-guard.angle;

        while(angleDifference>Math.PI)
            angleDifference-=Math.PI*2;

        while(angleDifference<-Math.PI)
            angleDifference+=Math.PI*2;

        const seesPlayer =
            distance < guard.viewDistance &&
            Math.abs(angleDifference) <
                guard.viewAngle/2 &&
            player.invisibility <= 0;

        if(seesPlayer){

            alarm = true;

            alertLevel += dt * 1.2;

            guard.angle =
                playerAngle;

            const speed =
                guard.speed *
                (1 + alertLevel*.15);

            if(distance>30){

                const nx = dx/distance;
                const ny = dy/distance;

                const newX =
                    guard.x + nx*speed*dt;

                const newY =
                    guard.y + ny*speed*dt;

                if(!isBlocked(newX,guard.y,guard.r))
                    guard.x = newX;

                if(!isBlocked(guard.x,newY,guard.r))
                    guard.y = newY;

            }

        }

        if(
            distance <
            player.r + guard.r + 3 &&
            player.invincible <= 0
        ){

            loseLife();

        }

    }

    if(!alarm){

        alertLevel -= dt*.5;

        alertLevel =
            Math.max(0,alertLevel);

    }

}


/* =========================
   LOSE LIFE
========================= */

function loseLife(){

    if(player.invincible > 0)
        return;

    lives--;

    updateHUD();

    spawnParticles(
        player.x,
        player.y,
        "#ff1744",
        30
    );

    if(lives <= 0){

        gameOver();

        return;

    }

    showMessage("CAUGHT! -1 LIFE");

    player.x = 70;
    player.y = H/2;

    player.invincible = 2;

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running = false;

    paused = false;

    document.getElementById("finalScore")
        .textContent = score;

    document.getElementById("finalLevel")
        .textContent = level;

    document.getElementById("gameOverScreen")
        .classList.remove("hidden");

}


/* =========================
   PARTICLES
========================= */

function spawnParticles(x,y,color,count){

    for(let i=0;i<count;i++){

        const angle =
            Math.random()*Math.PI*2;

        const speed =
            40+Math.random()*120;

        particles.push({

            x,
            y,

            vx:
                Math.cos(angle)*speed,

            vy:
                Math.sin(angle)*speed,

            life:
                .5+Math.random()*.7,

            color

        });

    }

}


function updateParticles(dt){

    for(const p of particles){

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        p.vx *= .96;
        p.vy *= .96;

        p.life -= dt;

    }

    particles =
        particles.filter(p=>p.life>0);

}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(0,0,W,H);

    /* BACKGROUND */

    ctx.fillStyle = "#050510";

    ctx.fillRect(0,0,W,H);


    /* GRID */

    ctx.strokeStyle =
        "rgba(25,247,255,.08)";

    ctx.lineWidth = 1;

    const grid = 40;

    for(let x=0;x<W;x+=grid){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();

    }

    for(let y=0;y<H;y+=grid){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }


    /* WALLS */

    for(const wall of walls){

        ctx.fillStyle =
            "rgba(20,25,45,.95)";

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

        ctx.strokeStyle =
            "#19f7ff";

        ctx.lineWidth = 2;

        ctx.strokeRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }


    /* EXIT */

    ctx.beginPath();

    ctx.arc(
        exit.x,
        exit.y,
        exit.r,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "rgba(25,247,255,.15)";

    ctx.fill();

    ctx.strokeStyle =
        "#19f7ff";

    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.fillStyle = "#19f7ff";

    ctx.font = "bold 12px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        "EXIT",
        exit.x,
        exit.y+4
    );


    /* LOOT */

    for(const item of loot){

        if(item.collected)
            continue;

        ctx.beginPath();

        ctx.arc(
            item.x,
            item.y,
            item.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle = "#ffe600";

        ctx.shadowBlur = 15;

        ctx.shadowColor = "#ffe600";

        ctx.fill();

        ctx.shadowBlur = 0;

    }


    /* TERMINALS */

    for(const terminal of terminals){

        ctx.beginPath();

        ctx.arc(
            terminal.x,
            terminal.y,
            terminal.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            terminal.hacked
            ? "#222"
            : "#ff2bd6";

        ctx.shadowBlur =
            terminal.hacked ? 0 : 15;

        ctx.shadowColor =
            "#ff2bd6";

        ctx.fill();

        ctx.shadowBlur = 0;

        ctx.fillStyle = "white";

        ctx.font = "10px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            terminal.hacked ? "OK" : "HACK",
            terminal.x,
            terminal.y+3
        );

    }


    /* GUARDS */

    for(const guard of guards){

        /* VISION CONE */

        ctx.beginPath();

        ctx.moveTo(
            guard.x,
            guard.y
        );

        ctx.arc(
            guard.x,
            guard.y,
            guard.viewDistance,
            guard.angle-guard.viewAngle/2,
            guard.angle+guard.viewAngle/2
        );

        ctx.closePath();

        ctx.fillStyle =
            alarm
            ? "rgba(255,20,70,.18)"
            : "rgba(255,50,100,.08)";

        ctx.fill();


        /* GUARD */

        ctx.beginPath();

        ctx.arc(
            guard.x,
            guard.y,
            guard.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle = "#ff1744";

        ctx.shadowBlur = 15;

        ctx.shadowColor = "#ff1744";

        ctx.fill();

        ctx.shadowBlur = 0;

    }


    /* PLAYER */

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.r,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        player.invincible > 0
        ? "#ffffff"
        : "#19f7ff";

    ctx.shadowBlur = 20;

    ctx.shadowColor = "#19f7ff";

    ctx.fill();

    ctx.shadowBlur = 0;


    /* PARTICLES */

    for(const p of particles){

        ctx.globalAlpha =
            Math.max(0,p.life);

        ctx.fillStyle = p.color;

        ctx.fillRect(
            p.x,
            p.y,
            3,
            3
        );

    }

    ctx.globalAlpha = 1;


    /* ALARM */

    if(alarm){

        ctx.fillStyle =
            "rgba(255,0,50,.08)";

        ctx.fillRect(
            0,0,W,H
        );

        ctx.fillStyle = "#ff1744";

        ctx.font = "bold 20px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "🚨 ALARM 🚨",
            W/2,
            100
        );

    }

}


/* =========================
   GAME LOOP
========================= */

let lastTime = performance.now();

function gameLoop(now){

    const dt =
        Math.min(
            (now-lastTime)/1000,
            .033
        );

    lastTime = now;

    if(running && !paused){

        movePlayer(dt);

        collectLoot();

        checkExit();

        updateGuards(dt);

        updateParticles(dt);

        player.dashCooldown =
            Math.max(
                0,
                player.dashCooldown-dt
            );

        player.invincible =
            Math.max(
                0,
                player.invincible-dt
            );

        player.invisibility =
            Math.max(
                0,
                player.invisibility-dt
            );

    }

    if(messageTimer>0){

        messageTimer -= dt;

        if(messageTimer<=0){

            document.getElementById("message")
                .textContent = "";

        }

    }

    draw();

    requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);
