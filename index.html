<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>NEON HEIST</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050510;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:10;

    display:flex;
    justify-content:space-between;
    gap:5px;

    color:white;
    font-weight:bold;
    font-size:14px;

    pointer-events:none;
}

.hudBox{
    background:rgba(0,0,0,.7);
    border:1px solid #19f7ff;
    border-radius:10px;
    padding:8px 10px;
}

#message{
    position:fixed;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;

    color:white;
    font-size:20px;
    font-weight:bold;
    text-align:center;

    text-shadow:0 0 15px #19f7ff;

    pointer-events:none;
}

.screen{
    position:fixed;
    inset:0;
    z-index:50;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,10,.92);

    color:white;
    text-align:center;
}

.panel{
    width:min(90%,500px);
    padding:30px;

    border:2px solid #19f7ff;
    border-radius:20px;

    background:#080816;

    box-shadow:0 0 30px rgba(25,247,255,.4);
}

h1{
    margin:0 0 15px;
    color:#19f7ff;
    font-size:45px;

    text-shadow:
    0 0 10px #19f7ff,
    0 0 30px #19f7ff;
}

.startButton{
    padding:16px 30px;
    border:0;
    border-radius:15px;

    background:#19f7ff;
    color:#001014;

    font-size:20px;
    font-weight:bold;

    touch-action:none;
}

.hidden{
    display:none!important;
}

/* =========================
   MOBILE / IPAD CONTROLS
========================= */

#mobileControls{
    position:fixed;
    inset:0;
    z-index:20;

    pointer-events:none;
}

#joystick{
    position:absolute;

    left:25px;
    bottom:25px;

    width:135px;
    height:135px;

    border-radius:50%;

    background:rgba(20,30,45,.7);
    border:3px solid #19f7ff;

    box-shadow:
    0 0 20px rgba(25,247,255,.4),
    inset 0 0 20px rgba(25,247,255,.2);

    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;

    width:58px;
    height:58px;

    left:50%;
    top:50%;

    margin-left:-29px;
    margin-top:-29px;

    border-radius:50%;

    background:#19f7ff;

    box-shadow:
    0 0 15px #19f7ff,
    0 0 30px #19f7ff;

    pointer-events:none;
}

.mobileButton{
    position:absolute;

    width:85px;
    height:85px;

    border-radius:50%;

    background:rgba(20,20,35,.85);

    color:white;
    font-weight:bold;

    border:3px solid #ff2bd6;

    pointer-events:auto;
    touch-action:none;
}

.mobileButton:active{
    transform:scale(.9);
}

#hackButton{
    right:130px;
    bottom:30px;
}

#dashButton{
    right:25px;
    bottom:110px;

    border-color:#19f7ff;
}

#pauseButton{
    position:fixed;

    top:65px;
    right:12px;

    z-index:25;

    width:45px;
    height:45px;

    border-radius:10px;

    background:rgba(0,0,0,.7);
    color:white;

    border:1px solid #19f7ff;

    pointer-events:auto;
}

/* LANDSCAPE */

@media(max-height:600px) and (orientation:landscape){

    #joystick{
        width:110px;
        height:110px;
        left:20px;
        bottom:15px;
    }

    #stick{
        width:50px;
        height:50px;
        margin-left:-25px;
        margin-top:-25px;
    }

    .mobileButton{
        width:72px;
        height:72px;
    }

    #hackButton{
        right:105px;
        bottom:15px;
    }

    #dashButton{
        right:18px;
        bottom:90px;
    }
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div class="hudBox">
        LEVEL <span id="level">1</span>
    </div>

    <div class="hudBox">
        💰 <span id="cash">0</span>
    </div>

    <div class="hudBox">
        ❤️ <span id="lives">3</span>
    </div>

    <div class="hudBox">
        SCORE <span id="score">0</span>
    </div>

</div>

<div id="message"></div>

<button id="pauseButton">Ⅱ</button>


<!-- START -->

<div id="startScreen" class="screen">

    <div class="panel">

        <h1>NEON HEIST</h1>

        <p>💰 Collect ALL the loot</p>
        <p>👮 Avoid the guards</p>
        <p>🚪 Reach the EXIT</p>

        <br>

        <button
        class="startButton"
        id="startButton">
        START HEIST
        </button>

    </div>

</div>


<!-- GAME OVER -->

<div id="gameOverScreen" class="screen hidden">

    <div class="panel">

        <h1>CAUGHT!</h1>

        <p>
            Score:
            <strong id="finalScore">0</strong>
        </p>

        <p>
            Level:
            <strong id="finalLevel">1</strong>
        </p>

        <br>

        <button
        class="startButton"
        id="restartButton">
        TRY AGAIN
        </button>

    </div>

</div>


<!-- CONTROLS -->

<div id="mobileControls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button
    class="mobileButton"
    id="hackButton">
    HACK
    </button>

    <button
    class="mobileButton"
    id="dashButton">
    DASH
    </button>

</div>


<script>

/* =================================
   CANVAS
================================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resizeCanvas(){

    const dpr =
    Math.min(devicePixelRatio || 1,2);

    W = innerWidth;
    H = innerHeight;

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);

window.addEventListener(
"orientationchange",
()=>{
    setTimeout(resizeCanvas,300);
});


/* =================================
   GAME VARIABLES
================================= */

let running=false;
let paused=false;

let level=1;
let score=0;
let cash=0;
let lives=3;

let transitioningLevel=false;

let walls=[];
let loot=[];
let guards=[];
let terminals=[];
let particles=[];

let alarm=false;
let alertLevel=0;

let messageTimer=0;

let exit={
    x:0,
    y:0,
    r:30
};


/* =================================
   PLAYER
================================= */

const player={

    x:70,
    y:200,

    r:15,

    speed:190,

    vx:0,
    vy:0,

    dashCooldown:0,

    invincible:1,

    invisibility:0
};


/* =================================
   KEYBOARD
================================= */

const keys={};

window.addEventListener(
"keydown",
e=>{

    keys[e.key.toLowerCase()]=true;

});

window.addEventListener(
"keyup",
e=>{

    keys[e.key.toLowerCase()]=false;

});


/* =================================
   JOYSTICK
================================= */

let joystickActive=false;
let joystickX=0;
let joystickY=0;

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");


function updateJoystick(x,y){

    const rect=
    joystick.getBoundingClientRect();

    const cx=
    rect.left+rect.width/2;

    const cy=
    rect.top+rect.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=42;

    const distance=
    Math.hypot(dx,dy);

    if(distance>max){

        dx=dx/distance*max;
        dy=dy/distance*max;

    }

    joystickX=dx/max;
    joystickY=dy/max;

    stick.style.transform=
    `translate(${dx}px,${dy}px)`;
}


function resetJoystick(){

    joystickActive=false;

    joystickX=0;
    joystickY=0;

    stick.style.transform=
    "translate(0,0)";
}


joystick.addEventListener(
"pointerdown",
e=>{

    e.preventDefault();

    joystickActive=true;

    joystick.setPointerCapture(
        e.pointerId
    );

    updateJoystick(
        e.clientX,
        e.clientY
    );

});


joystick.addEventListener(
"pointermove",
e=>{

    if(!joystickActive)
        return;

    updateJoystick(
        e.clientX,
        e.clientY
    );

});


joystick.addEventListener(
"pointerup",
resetJoystick
);

joystick.addEventListener(
"pointercancel",
resetJoystick
);


/* =================================
   MOVEMENT
================================= */

function getMovement(){

    let x=0;
    let y=0;

    if(keys["w"] ||
       keys["arrowup"])
        y--;

    if(keys["s"] ||
       keys["arrowdown"])
        y++;

    if(keys["a"] ||
       keys["arrowleft"])
        x--;

    if(keys["d"] ||
       keys["arrowright"])
        x++;

    if(joystickActive){

        x=joystickX;
        y=joystickY;

    }

    const length=
    Math.hypot(x,y);

    if(length>0){

        x/=length;
        y/=length;

    }

    return {x,y};
}


/* =================================
   COLLISION
================================= */

function circleRectCollision(
cx,cy,r,rect
){

    const closestX=
    Math.max(
        rect.x,
        Math.min(
            cx,
            rect.x+rect.w
        )
    );

    const closestY=
    Math.max(
        rect.y,
        Math.min(
            cy,
            rect.y+rect.h
        )
    );

    const dx=cx-closestX;
    const dy=cy-closestY;

    return dx*dx+dy*dy<r*r;
}


function isBlocked(x,y,r){

    for(const wall of walls){

        if(
            circleRectCollision(
                x,y,r,wall
            )
        )
            return true;

    }

    return false;
}


/* =================================
   SAFE POSITION
================================= */

function safePosition(r=15){

    for(let i=0;i<300;i++){

        const x=
        45+
        Math.random()*
        Math.max(50,W-90);

        const y=
        90+
        Math.random()*
        Math.max(50,H-140);

        if(isBlocked(x,y,r))
            continue;

        if(
            Math.hypot(
                x-player.x,
                y-player.y
            )<100
        )
            continue;

        return {x,y};

    }

    return {
        x:W/2,
        y:H/2
    };
}


/* =================================
   CREATE LEVEL
================================= */

function createLevel(){

    walls=[];
    loot=[];
    guards=[];
    terminals=[];
    particles=[];

    alarm=false;
    alertLevel=0;

    player.vx=0;
    player.vy=0;

    player.invincible=1;

    /*
       PLAYER ALWAYS STARTS
       ON THE LEFT
    */

    player.x=70;
    player.y=H/2;


    /* WALLS */

    const wallCount=
    Math.min(
        4+level,
        15
    );

    for(
        let i=0;
        i<wallCount;
        i++
    ){

        for(
            let tries=0;
            tries<100;
            tries++
        ){

            const wall={

                x:
                100+
                Math.random()*
                Math.max(30,W-220),

                y:
                90+
                Math.random()*
                Math.max(30,H-190),

                w:
                70+
                Math.random()*90,

                h:
                20+
                Math.random()*45

            };

            if(
                !circleRectCollision(
                    player.x,
                    player.y,
                    70,
                    wall
                )
            ){

                walls.push(wall);

                break;
            }
        }
    }


    /* =================================
       EXIT
    ================================= */

    exit.x=W-70;
    exit.y=H/2;


    /* =================================
       LOOT
    ================================= */

    const lootCount=
    Math.min(
        2+
        Math.floor(level/2),
        8
    );

    for(
        let i=0;
        i<lootCount;
        i++
    ){

        const p=
        safePosition(15);

        loot.push({

            x:p.x,
            y:p.y,

            r:11,

            value:
            50+level*10,

            collected:false

        });

    }


    /* =================================
       TERMINALS
    ================================= */

    const terminalCount=
    Math.min(
        1+
        Math.floor(level/4),
        3
    );

    for(
        let i=0;
        i<terminalCount;
        i++
    ){

        const p=
        safePosition(18);

        terminals.push({

            x:p.x,
            y:p.y,

            r:17,

            hacked:false

        });

    }


    /* =================================
       GUARDS
    ================================= */

    const guardCount=
    Math.min(
        1+
        Math.floor(level/2),
        8
    );

    for(
        let i=0;
        i<guardCount;
        i++
    ){

        const p=
        safePosition(18);

        guards.push({

            x:p.x,
            y:p.y,

            r:14,

            speed:
            45+level*4,

            angle:
            Math.random()*
            Math.PI*2,

            viewDistance:
            150+level*4,

            viewAngle:
            Math.PI/3,

            turnTimer:
            1+Math.random()*2

        });

    }

    updateHUD();
}


/* =================================
   HUD
================================= */

function updateHUD(){

    document.getElementById(
        "level"
    ).textContent=level;

    document.getElementById(
        "cash"
    ).textContent=cash;

    document.getElementById(
        "lives"
    ).textContent=lives;

    document.getElementById(
        "score"
    ).textContent=score;

}


/* =================================
   MESSAGE
================================= */

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2;
}


/* =================================
   HACK
================================= */

function hack(){

    if(!running || paused)
        return;

    for(const terminal of terminals){

        if(terminal.hacked)
            continue;

        const d=
        Math.hypot(
            player.x-terminal.x,
            player.y-terminal.y
        );

        if(d<70){

            terminal.hacked=true;

            score+=100;

            showMessage(
                "TERMINAL HACKED +100"
            );

            spawnParticles(
                terminal.x,
                terminal.y,
                "#ff2bd6",
                20
            );

            updateHUD();

            return;
        }
    }

}


/* =================================
   DASH
================================= */

function dash(){

    if(
        !running ||
        paused ||
        transitioningLevel
    )
        return;

    if(player.dashCooldown>0)
        return;

    const move=getMovement();

    if(
        move.x===0 &&
        move.y===0
    )
        return;

    let newX=
    player.x+move.x*130;

    let newY=
    player.y+move.y*130;

    if(
        !isBlocked(
            newX,
            player.y,
            player.r
        )
    )
        player.x=newX;

    if(
        !isBlocked(
            player.x,
            newY,
            player.r
        )
    )
        player.y=newY;

    player.x=
    Math.max(
        player.r,
        Math.min(
            W-player.r,
            player.x
        )
    );

    player.y=
    Math.max(
        65,
        Math.min(
            H-player.r,
            player.y
        )
    );

    player.dashCooldown=2;

    player.invincible=.5;

    spawnParticles(
        player.x,
        player.y,
        "#19f7ff",
        20
    );
}


/* =================================
   BUTTONS
================================= */

document.getElementById(
"hackButton"
).addEventListener(
"pointerdown",
e=>{
    e.preventDefault();
    hack();
});


document.getElementById(
"dashButton"
).addEventListener(
"pointerdown",
e=>{
    e.preventDefault();
    dash();
});


document.getElementById(
"pauseButton"
).addEventListener(
"pointerdown",
e=>{

    e.preventDefault();

    if(!running)
        return;

    paused=!paused;

    e.target.textContent=
    paused ? "▶" : "Ⅱ";

});


document.getElementById(
"startButton"
).addEventListener(
"pointerdown",
e=>{

    e.preventDefault();
    startGame();

});


document.getElementById(
"restartButton"
).addEventListener(
"pointerdown",
e=>{

    e.preventDefault();
    startGame();

});


/* =================================
   START
================================= */

function startGame(){

    document.getElementById(
        "startScreen"
    ).classList.add("hidden");

    document.getElementById(
        "gameOverScreen"
    ).classList.add("hidden");

    running=true;
    paused=false;

    transitioningLevel=false;

    level=1;
    score=0;
    cash=0;
    lives=3;

    player.speed=190;
    player.dashCooldown=0;
    player.invincible=1;

    createLevel();

    updateHUD();
}


/* =================================
   MOVE PLAYER
================================= */

function movePlayer(dt){

    if(transitioningLevel)
        return;

    const move=
    getMovement();

    player.vx=
    move.x*player.speed;

    player.vy=
    move.y*player.speed;

    const newX=
    player.x+
    player.vx*dt;

    const newY=
    player.y+
    player.vy*dt;


    if(
        !isBlocked(
            newX,
            player.y,
            player.r
        )
    ){

        player.x=newX;

    }


    if(
        !isBlocked(
            player.x,
            newY,
            player.r
        )
    ){

        player.y=newY;

    }


    player.x=
    Math.max(
        player.r,
        Math.min(
            W-player.r,
            player.x
        )
    );

    player.y=
    Math.max(
        65,
        Math.min(
            H-player.r,
            player.y
        )
    );
}


/* =================================
   COLLECT LOOT
================================= */

function collectLoot(){

    for(const item of loot){

        if(item.collected)
            continue;

        const d=
        Math.hypot(
            player.x-item.x,
            player.y-item.y
        );

        if(
            d<
            player.r+item.r
        ){

            item.collected=true;

            cash+=item.value;
            score+=item.value;

            showMessage(
                "💰 LOOT +"+item.value
            );

            spawnParticles(
                item.x,
                item.y,
                "#ffe600",
                15
            );

            updateHUD();
        }
    }
}


/* =================================
   EXIT CHECK — FIXED
================================= */

function checkExit(){

    const distance=
    Math.hypot(
        player.x-exit.x,
        player.y-exit.y
    );


    const allLootCollected=
    loot.length>0 &&
    loot.every(
        item=>item.collected
    );


    if(
        distance<
        player.r+exit.r
    ){

        /*
           EXIT LOCKED
        */

        if(!allLootCollected){

            showMessage(
                "🔒 COLLECT ALL LOOT FIRST!"
            );

            return;
        }


        /*
           EXIT OPEN
        */

        if(!transitioningLevel){

            levelComplete();

        }
    }
}


/* =================================
   LEVEL COMPLETE — FIXED
================================= */

function levelComplete(){

    if(transitioningLevel)
        return;

    transitioningLevel=true;

    player.vx=0;
    player.vy=0;

    const reward=
    cash*2;

    score+=reward;

    showMessage(
        "🚪 HEIST COMPLETE! +"+
        reward
    );

    spawnParticles(
        exit.x,
        exit.y,
        "#19f7ff",
        50
    );


    setTimeout(()=>{

        if(!running){

            transitioningLevel=false;
            return;

        }


        /*
           IMPORTANT:
           ONLY INCREASE BY 1
        */

        level=level+1;


        /*
           NEVER ALLOW
           LEVEL 74 BUG
        */

        if(level<1)
            level=1;


        createLevel();

        transitioningLevel=false;

        updateHUD();

        showMessage(
            "LEVEL "+level
        );

    },1200);
}


/* =================================
   GUARDS
================================= */

function updateGuards(dt){

    alarm=false;

    for(const guard of guards){

        guard.turnTimer-=dt;

        if(guard.turnTimer<=0){

            guard.turnTimer=
            1+Math.random()*2;

            guard.angle+=
            (Math.random()-.5)*1.5;
        }


        const dx=
        player.x-guard.x;

        const dy=
        player.y-guard.y;

        const distance=
        Math.hypot(dx,dy);


        const playerAngle=
        Math.atan2(dy,dx);

        let diff=
        playerAngle-guard.angle;


        while(diff>Math.PI)
            diff-=Math.PI*2;

        while(diff<-Math.PI)
            diff+=Math.PI*2;


        const sees=
        distance<
        guard.viewDistance &&
        Math.abs(diff)<
        guard.viewAngle/2 &&
        player.invisibility<=0;


        if(sees){

            alarm=true;

            alertLevel+=dt;


            guard.angle=
            playerAngle;


            if(distance>30){

                const nx=
                dx/distance;

                const ny=
                dy/distance;

                const speed=
                guard.speed;

                const newX=
                guard.x+
                nx*speed*dt;

                const newY=
                guard.y+
                ny*speed*dt;


                if(
                    !isBlocked(
                        newX,
                        guard.y,
                        guard.r
                    )
                )
                    guard.x=newX;


                if(
                    !isBlocked(
                        guard.x,
                        newY,
                        guard.r
                    )
                )
                    guard.y=newY;

            }

        }


        if(
            distance<
            player.r+
            guard.r+
            3 &&
            player.invincible<=0
        ){

            loseLife();

        }
    }


    if(!alarm){

        alertLevel=
        Math.max(
            0,
            alertLevel-dt
        );

    }
}


/* =================================
   LOSE LIFE
================================= */

function loseLife(){

    if(player.invincible>0)
        return;

    lives--;

    updateHUD();

    if(lives<=0){

        gameOver();
        return;

    }

    showMessage(
        "🚨 CAUGHT! -1 LIFE"
    );

    player.x=70;
    player.y=H/2;

    player.invincible=2;
}


/* =================================
   GAME OVER
================================= */

function gameOver(){

    running=false;

    document.getElementById(
        "finalScore"
    ).textContent=score;

    document.getElementById(
        "finalLevel"
    ).textContent=level;

    document.getElementById(
        "gameOverScreen"
    ).classList.remove("hidden");
}


/* =================================
   PARTICLES
================================= */

function spawnParticles(
x,y,color,count
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const angle=
        Math.random()*
        Math.PI*2;

        const speed=
        40+
        Math.random()*100;

        particles.push({

            x:x,
            y:y,

            vx:
            Math.cos(angle)*speed,

            vy:
            Math.sin(angle)*speed,

            life:
            .5+
            Math.random()*.6,

            color:color
        });
    }
}


function updateParticles(dt){

    for(const p of particles){

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vx*=.96;
        p.vy*=.96;

        p.life-=dt;
    }

    particles=
    particles.filter(
        p=>p.life>0
    );
}


/* =================================
   DRAW
================================= */

function draw(){

    ctx.clearRect(
        0,0,W,H
    );


    /* BACKGROUND */

    ctx.fillStyle="#050510";

    ctx.fillRect(
        0,0,W,H
    );


    /* GRID */

    ctx.strokeStyle=
    "rgba(25,247,255,.07)";

    ctx.lineWidth=1;


    for(
        let x=0;
        x<W;
        x+=40
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();
    }


    for(
        let y=0;
        y<H;
        y+=40
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();
    }


    /* WALLS */

    for(const wall of walls){

        ctx.fillStyle=
        "#14192d";

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

        ctx.strokeStyle=
        "#19f7ff";

        ctx.strokeRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );
    }


    /* =================================
       EXIT — FIXED VISUAL
    ================================= */

    const allLootCollected=
    loot.length>0 &&
    loot.every(
        item=>item.collected
    );


    ctx.beginPath();

    ctx.arc(
        exit.x,
        exit.y,
        exit.r,
        0,
        Math.PI*2
    );


    /*
       GREEN = OPEN
       RED = LOCKED
    */

    ctx.fillStyle=
    allLootCollected
    ? "rgba(0,255,100,.25)"
    : "rgba(255,30,60,.20)";

    ctx.fill();


    ctx.strokeStyle=
    allLootCollected
    ? "#00ff66"
    : "#ff304f";

    ctx.lineWidth=4;

    ctx.shadowBlur=20;

    ctx.shadowColor=
    allLootCollected
    ? "#00ff66"
    : "#ff304f";

    ctx.stroke();

    ctx.shadowBlur=0;


    ctx.fillStyle=
    allLootCollected
    ? "#00ff66"
    : "#ff304f";

    ctx.font=
    "bold 11px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        allLootCollected
        ? "EXIT"
        : "LOCKED",
        exit.x,
        exit.y+4
    );


    /* LOOT */

    for(const item of loot){

        if(item.collected)
            continue;

        ctx.beginPath();

        ctx.arc(
            item.x,
            item.y,
            item.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#ffe600";

        ctx.shadowBlur=15;
        ctx.shadowColor="#ffe600";

        ctx.fill();

        ctx.shadowBlur=0;
    }


    /* TERMINALS */

    for(const terminal of terminals){

        ctx.beginPath();

        ctx.arc(
            terminal.x,
            terminal.y,
            terminal.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
        terminal.hacked
        ? "#333"
        : "#ff2bd6";

        ctx.fill();

        ctx.fillStyle="white";

        ctx.font=
        "bold 9px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            terminal.hacked
            ? "OK"
            : "HACK",
            terminal.x,
            terminal.y+3
        );
    }


    /* GUARDS */

    for(const guard of guards){

        /* VISION */

        ctx.beginPath();

        ctx.moveTo(
            guard.x,
            guard.y
        );

        ctx.arc(
            guard.x,
            guard.y,
            guard.viewDistance,
            guard.angle-
            guard.viewAngle/2,
            guard.angle+
            guard.viewAngle/2
        );

        ctx.closePath();

        ctx.fillStyle=
        alarm
        ? "rgba(255,0,50,.2)"
        : "rgba(255,0,50,.07)";

        ctx.fill();


        /* GUARD */

        ctx.beginPath();

        ctx.arc(
            guard.x,
            guard.y,
            guard.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#ff1744";

        ctx.shadowBlur=15;
        ctx.shadowColor="#ff1744";

        ctx.fill();

        ctx.shadowBlur=0;
    }


    /* PLAYER */

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.r,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
    player.invincible>0
    ? "white"
    : "#19f7ff";

    ctx.shadowBlur=20;
    ctx.shadowColor="#19f7ff";

    ctx.fill();

    ctx.shadowBlur=0;


    /* PARTICLES */

    for(const p of particles){

        ctx.globalAlpha=
        Math.max(0,p.life);

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            4,
            4
        );
    }

    ctx.globalAlpha=1;


    /* ALARM */

    if(alarm){

        ctx.fillStyle=
        "rgba(255,0,50,.08)";

        ctx.fillRect(
            0,0,W,H
        );

        ctx.fillStyle="#ff1744";

        ctx.font=
        "bold 20px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "🚨 ALARM 🚨",
            W/2,
            105
        );
    }
}


/* =================================
   GAME LOOP
================================= */

let lastTime=
performance.now();

function gameLoop(now){

    const dt=
    Math.min(
        (now-lastTime)/1000,
        .033
    );

    lastTime=now;


    if(
        running &&
        !paused
    ){

        movePlayer(dt);

        collectLoot();

        checkExit();

        updateGuards(dt);

        updateParticles(dt);


        player.dashCooldown=
        Math.max(
            0,
            player.dashCooldown-dt
        );


        player.invincible=
        Math.max(
            0,
            player.invincible-dt
        );

    }


    if(messageTimer>0){

        messageTimer-=dt;

        if(messageTimer<=0){

            document.getElementById(
                "message"
            ).textContent="";

        }
    }


    draw();

    requestAnimationFrame(
        gameLoop
    );
}

requestAnimationFrame(
gameLoop
);
